<div id="game-container">
  <div class="flex flex-col items-center justify-center min-h-full p-6 bg-white">
    <div class="text-center max-w-sm">
      <h1 class="text-4xl text-accent-warm mb-2">Soc Ops</h1>
      <p class="text-secondary text-sm mb-8 font-light">Connect. Play. Win.</p>

      <div class="card card-content mb-8">
        <h2 class="text-lg mb-4 text-primary">How to play</h2>
        <ul class="text-left text-secondary text-sm space-y-3">
          <li><span class="text-accent-warm">→</span> Find people who match the questions</li>
          <li><span class="text-accent-warm">→</span> Tap a square when you find a match</li>
          <li><span class="text-accent-warm">→</span> Get 5 in a row to win</li>
        </ul>
      </div>

      <button
        hx-post="/start"
        hx-target="#game-container"
        hx-swap="outerHTML"
        class="btn-primary">
        Start Game
      </button>
    </div>
  </div>
</div>
