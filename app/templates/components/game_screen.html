<div id="game-container">
  <div class="flex flex-col min-h-full bg-white">
    <!-- Header -->
    <header class="flex items-center justify-between">
      <button
        hx-post="/reset"
        hx-target="#game-container"
        hx-swap="outerHTML"
        class="btn-secondary">
        ← Back
      </button>
      <h1>Soc Ops</h1>
      <div class="w-16"></div>
    </header>

    <!-- Instructions -->
    <p class="instructions">
      Tap a square when you find someone who matches.
    </p>

    <!-- Bingo indicator -->
    {% if session.has_bingo %}
    <div class="status-success">
      🎉 BINGO! You got a line!
    </div>
    {% endif %}

    <!-- Board -->
    <div class="flex-1 flex items-center justify-center p-6">
      {% include "components/bingo_board.html" %}
    </div>
  </div>

  {% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
  {% endif %}
</div>
